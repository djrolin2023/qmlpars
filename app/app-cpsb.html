<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>车牌识别</title>
<!-- 安卓专属：注入服务端地址，供 cpsb 同源脚本访问 -->
<script src="./app-config.js"></script>
<script>
  // 优先使用用户在 APP 内配置的服务器地址（localStorage），其次打包默认值
  try {
    var _custom = localStorage.getItem('user_server_url');
    if (_custom && /^https?:\/\//.test(_custom)) {
      window.__API_BASE__ = _custom;
      if (window.APP_CONFIG) window.APP_CONFIG.serverUrl = _custom;
    } else {
      window.__API_BASE__ = (window.APP_CONFIG && window.APP_CONFIG.serverUrl ? window.APP_CONFIG.serverUrl : '');
    }
  } catch (_) {
    window.__API_BASE__ = (window.APP_CONFIG && window.APP_CONFIG.serverUrl ? window.APP_CONFIG.serverUrl : '');
  }
</script>
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="appWrap">
  <header class="topbar">
    <div class="org-stack">
      <img src="../static/images/logo.png" alt="school logo" class="school-logo">
      <div class="org-text">
        <div class="org-name" id="orgName">校园车辆识别系统</div>
        <div class="org-sub" id="orgSub">车牌识别 · 门卫端</div>
      </div>
    </div>
    <div id="topUser" class="top-user"></div>
  </header>

  <main id="main">
    <div class="tabs">
      <button class="tab active" data-tab="cam" id="tabCam">摄像头扫描</button>
      <button class="tab" data-tab="q" id="tabQ">输入查询</button>
    </div>

    <section id="tab-cam" class="tab-panel active">
      <div class="cam-wrap">
        <div class="cam-frame">
          <video id="video" playsinline autoplay muted></video>
          <div class="cam-corner tl"></div><div class="cam-corner tr"></div>
          <div class="cam-corner bl"></div><div class="cam-corner br"></div>
          <div class="cam-cross"></div>
          <div class="cam-scanline"></div>
          <div class="cam-status" id="camStatus">扫描中…</div>
          <div class="cam-mask hidden" id="camMask">
            <button class="mask-resume" onclick="resumeScan()">继续扫描</button>
          </div>
        </div>
        <div class="cam-tools">
          <button id="torchBtn" class="tool-btn hidden" title="灯光">💡</button>
          <button id="switchBtn" class="tool-btn" onclick="switchCam()">⇄ 切换镜头</button>
          <button id="stopBtn" class="tool-btn primary" onclick="toggleScan()">停止扫描</button>
        </div>
        <p class="tip">对准车牌，保持 1~2 秒即可自动识别</p>
      </div>
    </section>

    <section id="tab-q" class="tab-panel">
      <div class="query-box">
        <input id="qPlate" class="q-input" placeholder="输入车牌号，如 粤B12345" maxlength="10" autocomplete="off" autocapitalize="characters" inputmode="text" enterkeyhint="search" onblur="this.value=this.value.toUpperCase().replace(/[\s·\-.　]/g,'')">
        <button class="q-btn" onclick="queryPlate()">查询</button>
        <div id="qErr" class="q-err"></div>
      </div>
    </section>

    <div id="result" class="result-card hidden"></div>
  </main>

  <nav class="bottom-tabs">
    <button class="bottom-tab active" data-tab="cpsb">
      <span class="bt-icon">🔍</span><span class="bt-label">车牌识别</span>
    </button>
    <button class="bottom-tab" data-tab="vehicles" onclick="location.href='./app-vehicles.html'">
      <span class="bt-icon">🚗</span><span class="bt-label">车辆管理</span>
    </button>
  </nav>
</div>

<div id="loading" class="loading"><div class="spinner"></div></div>

<!-- 登录遮罩（含自动登录） -->
<div id="loginOverlay" class="login-overlay">
  <form id="loginForm" class="login-card" onsubmit="return false">
    <div class="login-logo"><img src="../static/images/logo.png" alt=""></div>
    <h2>车牌识别</h2>
    <p class="login-sub">请登录后使用</p>
    <input id="loginUser" class="login-input" placeholder="登录账号" autocomplete="username">
    <input id="loginPass" class="login-input" type="password" placeholder="密码" autocomplete="current-password">
    <label class="auto-login"><input id="autoLogin" type="checkbox"> 自动登录</label>
    <div id="loginErr" class="login-err"></div>
    <button type="submit" class="login-btn">登录</button>
    <div class="server-cfg">
      <button type="button" class="server-cfg-toggle" onclick="toggleServerCfg(this)" title="服务器地址">⚙ 服务器</button>
      <div class="server-cfg-box" style="display:none">
        <input id="serverUrlInput" class="login-input server-url-input" placeholder="服务器地址，如 https://jyedu.wl.gd.cn">
        <div class="server-cfg-actions">
          <button type="button" class="server-cfg-save" onclick="saveServerUrl()">保存</button>
          <button type="button" class="server-cfg-reset" onclick="resetServerUrl()">恢复默认</button>
        </div>
      </div>
    </div>
  </form>
</div>

<script src="./js/common.js"></script>
<script src="./js/camera.js"></script>
<script src="./js/query.js"></script>
<script>
  // 顶部 tab 切换（与 cpsb 一致）
  document.querySelectorAll('.tabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-'+t.dataset.tab).classList.add('active');
      if(t.dataset.tab==='cam'){
        // 切回摄像头：若摄像头已关闭则重新开启，否则恢复自动扫描
        if(typeof stream==='undefined' || !stream){ if(typeof startCam==='function') startCam(); }
        else if(typeof startScanning==='function') startScanning();
      } else if(t.dataset.tab==='q'){
        if(typeof stopCam==='function') stopCam();
      }
    });
  });
  // 进入即校验登录
  ensureLoggedIn();
</script>
</body>
</html>
