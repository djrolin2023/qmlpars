<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 配置 - QMLPARS 管理后台</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="embed">
  <div class="main">
    <div class="content">
      <nav class="crumb" id="crumb"></nav>

      <div class="panel">
        <h3>百度 OCR</h3>
        <div class="form-row"><label>API Key</label><input id="BAIDU_API_KEY" placeholder="留空表示不修改"></div>
        <div class="form-row"><label>Secret Key</label><input id="BAIDU_SECRET_KEY" type="password" placeholder="留空表示不修改"></div>
      </div>
      <div class="panel">
        <h3>腾讯 OCR</h3>
        <div class="form-row"><label>SecretId</label><input id="TENCENT_SECRET_ID" placeholder="留空表示不修改"></div>
        <div class="form-row"><label>SecretKey</label><input id="TENCENT_SECRET_KEY" type="password" placeholder="留空表示不修改"></div>
      </div>
      <button class="btn primary" id="save-btn">保存配置</button>
    </div>
    <div class="page-footer" id="site-footer-text"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/ocr.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      initOcr();
    })();
  </script>
</body>
</html>
