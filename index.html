<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>车牌识别管理系统</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0b1a2b, #0e2a3f); color: #e6f0ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { text-align: center; padding: 24px; }
    .logo { font-size: 26px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
    .sub { color: #8fb6d6; margin-bottom: 28px; font-size: 14px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 14px; max-width: 560px; margin: 0 auto; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(120,200,255,.2); border-radius: 12px; padding: 22px 14px;
      text-decoration: none; color: #e6f0ff; transition: .2s; }
    .card:hover { background: rgba(120,200,255,.16); transform: translateY(-2px); }
    .card .t { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card .d { font-size: 12px; color: #8fb6d6; }
    .foot { margin-top: 26px; font-size: 12px; color: #6c8aa6; }
    @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">车牌识别管理系统</div>
    <div class="sub">正在根据设备自动跳转…</div>
    <div class="cards" id="cards" style="display:none">
      <a class="card" href="/admin/"><div class="t">PC 管理后台</div><div class="d">电脑端 · 车辆/记录/设置</div></a>
      <a class="card" href="/cpsb/"><div class="t">H5 移动端</div><div class="d">微信/手机浏览器</div></a>
      <a class="card" href="/app/"><div class="t">APP 端</div><div class="d">原生应用内嵌</div></a>
    </div>
    <div class="foot" id="foot">若未自动跳转，请手动选择上方入口</div>
  </div>
  <script>
    (function () {
      var UA = navigator.userAgent || '';
      var q = location.search || '';
      // 1) 显式参数或 APP 专属 UA 关键字 → APP 端
      var isApp = /[?&](from=app|app=1)\b/.test(q) || /QMLPARS_APP/i.test(UA);
      // 2) 微信 / 移动端 → H5
      var isMobile = /MicroMessenger|Mobile|Android|iPhone|iPad|iPod|Windows Phone/i.test(UA);
      var target;
      if (isApp) target = '/app/';
      else if (isMobile) target = '/cpsb/';
      else target = '/admin/';
      // 手动模式：?manual=1 不自动跳，展示卡片
      if (/[?&]manual=1\b/.test(q)) {
        document.getElementById('cards').style.display = 'grid';
        document.querySelector('.sub').textContent = '请选择入口';
        return;
      }
      location.replace(target);
    })();
  </script>
</body>
</html>
