<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乾明车牌识别系统 - 管理后台</title>
  <link rel="icon" href="/static/images/logo.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body style="overflow:hidden">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="sideLogo"></div>
        <div class="brand-text">车牌识别后台<small>乾明车牌识别系统 Admin</small></div>
      </div>
      <nav id="menu">
        <a data-page="dashboard.html">数据大屏</a>
        <a data-page="vehicles.html">车辆管理</a>
        <a data-page="users.html">用户管理</a>
        <a data-page="logs.html">识别记录</a>
        <a data-page="backup.html">备份恢复</a>
        <a data-page="buildapp.html">APP打包</a>
        <a data-page="syslog.html">系统日志</a>
        <a data-page="settings.html">系统设置</a>
        <a data-page="about.html">关于系统</a>
      </nav>
      <div class="side-version">
        <a href="javascript:void(0)" id="version-info" title="点击检查更新" onclick="if(window.openUpgradeModal){openUpgradeModal();return false;}">版本号：加载中…</a>
        <span class="update-dot" id="update-dot" style="display:none" title="有可用更新">● 可升级</span>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-col">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="菜单">☰</button>
        <span id="page-title">数据大屏</span>
        <div class="tb-right">
          <span class="time-now" id="time-now">--</span>
          <div class="user-dropdown" id="user-dd">
            <button class="tb-user" id="tb-user">管理员</button>
            <div class="user-menu" id="user-menu">
              <a id="menu-chg-pass">修改密码</a>
              <a id="menu-logout">退出登录</a>
            </div>
          </div>
        </div>
      </div>
      <iframe class="frame" id="frame" src="dashboard.html"></iframe>
      <div class="foot">
        <div class="copyright">© 2026 乾明工作室 版权所有 | 技术支持：乾明</div>
        <span id="icp-line"></span>
        <span id="police-line"></span>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-mask" id="pass-modal">
    <div class="modal">
      <div class="modal-head">修改密码<span class="x" id="pass-close">×</span></div>
      <div class="modal-body">
        <div class="form-row"><label>旧密码</label><input id="pass-old" type="password" placeholder="当前管理密码"></div>
        <div class="form-row"><label>新密码（至少6位）</label><input id="pass-new" type="password" placeholder="新密码"></div>
        <div class="form-row"><label>确认新密码</label><input id="pass-confirm" type="password" placeholder="再次输入新密码"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="pass-cancel">取消</button>
        <button class="btn primary" id="pass-save">保存</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/upgrade.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      // 注入侧边栏菜单图标、面包屑、时钟等公共逻辑
      if (typeof adminInit === 'function') adminInit();
      // 注意：checkAuth() 已自动把 #tb-user 填充为"当前登录用户：xxx"

      // 加载公开设置（备案号 / 公安图标 / 公司名等）
      try {
        const sr = await fetch(API + '/api/settings/public').then(r => r.json()).catch(() => ({ success: false }));
        if (sr && sr.success && sr.data) {
          const d = sr.data;
          // ICP 备案号
          const icpLine = document.getElementById('icp-line');
          if (icpLine) {
            const icpNo = d.ICP_NO || '';
            if (icpNo) {
              const a = document.createElement('a');
              a.href = 'https://beian.miit.gov.cn/';
              a.target = '_blank'; a.rel = 'noopener';
              a.textContent = icpNo;
              icpLine.appendChild(a);
            } else icpLine.style.display = 'none';
          }
          // 公安备案号（图标在前 + 编号在右）
          const policeLine = document.getElementById('police-line');
          if (policeLine) {
            const policeNo = d.POLICE_NO || '';
            if (policeNo) {
              const code = String(policeNo).replace(/^[\u4e00-\u9fa5]公网安备/, '').replace(/号$/, '').trim();
              const url = ((d.POLICE_URL && d.POLICE_URL.indexOf('#') < 0)
                ? d.POLICE_URL
                : 'https://beian.mps.gov.cn/#/query/webSearch')
                + (code ? '?code=' + encodeURIComponent(code) : '');
              const a = document.createElement('a');
              a.href = url; a.target = '_blank'; a.rel = 'noopener';
              a.style.cssText = 'display:inline-flex;align-items:center;gap:4px;text-decoration:none;';
              const icon = document.createElement('img');
              icon.className = 'police-icon';
              icon.src = d.POLICE_ICON_URL || '/static/images/police.png';
              icon.alt = '';
              icon.onerror = () => { icon.style.display = 'none'; };
              const span = document.createElement('span');
              span.textContent = policeNo;
              a.appendChild(icon);
              a.appendChild(span);
              policeLine.appendChild(a);
            } else policeLine.style.display = 'none';
          }
        }
      } catch (_) { /* 备案为非关键信息，失败静默 */ }

      // 时钟
      const pad = n => String(n).padStart(2, '0');
      const tick = () => {
        const d = new Date();
        const el = document.getElementById('time-now');
        if (el) el.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      };
      tick(); setInterval(tick, 1000);

      // 菜单切换
      const frame = document.getElementById('frame');
      const titleEl = document.getElementById('page-title');
      const links = document.querySelectorAll('#menu a');
      const sidebar = document.getElementById('menu');
      const menuToggle = document.getElementById('menu-toggle');
      function activate(a) {
        links.forEach(x => x.classList.toggle('active', x === a));
        const page = a.dataset.page;
        frame.src = page;
        if (titleEl) titleEl.textContent = a.textContent.trim();
        // 手机端点击菜单后收起侧栏
        if (window.matchMedia('(max-width: 768px)').matches) sidebar.classList.remove('open');
      }
      links.forEach(a => a.addEventListener('click', () => activate(a)));
      // 汉堡按钮切换侧栏
      if (menuToggle) menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
      // 点击遮罩关闭侧栏（手机端）
      document.getElementById('sidebar-overlay')?.addEventListener('click', () => sidebar.classList.remove('open'));
      // 默认高亮第一项
      if (links.length) links[0].classList.add('active');

      // 退出登录
      const doLogoutFn = () => {
        const tk = getToken();
        if (tk) fetch(API + '/api/admin/logout', { method: 'POST', headers: authHeaders() }).catch(() => {});
        setToken('');
        localStorage.removeItem('qmlpars_admin_user');
        location.href = 'login.html';
      };

      // 用户下拉菜单
      const dd = document.getElementById('user-dd');
      const menu = document.getElementById('user-menu');
      const tbUser = document.getElementById('tb-user');
      tbUser.addEventListener('click', e => {
        e.stopPropagation();
        menu.classList.toggle('show');
      });
      document.addEventListener('click', e => {
        if (dd && !dd.contains(e.target)) menu.classList.remove('show');
      });
      document.getElementById('menu-logout').addEventListener('click', () => { menu.classList.remove('show'); doLogoutFn(); });

      // 修改密码弹窗
      const passModal = document.getElementById('pass-modal');
      document.getElementById('menu-chg-pass').addEventListener('click', () => {
        menu.classList.remove('show');
        passModal.classList.add('show');
        document.getElementById('pass-old').value = '';
        document.getElementById('pass-new').value = '';
        document.getElementById('pass-confirm').value = '';
        document.getElementById('pass-old').focus();
      });
      document.getElementById('pass-cancel').addEventListener('click', () => passModal.classList.remove('show'));
      document.getElementById('pass-close').addEventListener('click', () => passModal.classList.remove('show'));
      passModal.addEventListener('click', e => { if (e.target === passModal) passModal.classList.remove('show'); });

      // 通用模态框关闭（× / 取消按钮 / 点遮罩）
      document.querySelectorAll('.modal-mask[data-close], [data-close]').forEach(el => {
        if (el.classList.contains('modal-mask')) {
          el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
        }
      });
      document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-close');
          const m = document.getElementById(id);
          if (m) m.classList.remove('show');
        });
      });

      async function submitChangePass() {
        const oldPass = document.getElementById('pass-old').value;
        const newPass = document.getElementById('pass-new').value;
        const confirm = document.getElementById('pass-confirm').value;
        if (!oldPass) { toast('请输入旧密码'); return; }
        if (!newPass || newPass.length < 6) { toast('新密码至少6位'); return; }
        if (newPass !== confirm) { toast('两次输入的新密码不一致'); return; }
        const btn = document.getElementById('pass-save');
        btn.disabled = true; btn.textContent = '保存中…';
        try {
          const r = await api('/api/admin/change-password', { method: 'POST', body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass }) });
          if (!r.success) throw new Error(r.message || '修改失败');
          toast('密码已修改，请重新登录');
          passModal.classList.remove('show');
          setTimeout(doLogoutFn, 1200);
        } catch (e) {
          toast('修改失败：' + e.message);
        } finally {
          btn.disabled = false; btn.textContent = '保存';
        }
      }
      document.getElementById('pass-save').addEventListener('click', submitChangePass);
      applyBrandLogo(document.getElementById('sideLogo'), 'icon');
      applyFavicon();
    })();
  </script>
</body>
</html>
