<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 乾明车牌识别系统 - 管理后台</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    .page { padding: 28px 24px 56px; }
    body {
      background-color:#0B1118;
      background-image:
        radial-gradient(900px 600px at 12% -8%, rgba(0,180,255,.16), transparent 60%),
        radial-gradient(800px 600px at 100% 0%, rgba(54,207,201,.12), transparent 55%),
        radial-gradient(700px 700px at 85% 110%, rgba(0,120,255,.12), transparent 60%),
        linear-gradient(rgba(120,200,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,200,255,.05) 1px, transparent 1px);
      background-size: auto, auto, auto, 32px 32px, 32px 32px;
      background-attachment: fixed;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    .layout { display:flex; gap:20px; align-items:flex-start; }
    .nav { width: 200px; flex:none; background:rgba(29,39,51,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(120,200,255,.18); border-radius:14px; padding:24px 10px 10px; position:sticky; top:18px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:10px; cursor:pointer; font-size:14px; color:#cbd5e1; transition:all .15s; margin-bottom:4px; }
    .nav-item:hover { background:rgba(120,200,255,.08); color:#fff; }
    .nav-item.active { background:rgba(24,144,255,.14); color:#4cb3ff; font-weight:600; box-shadow:none; }
    .nav-item .ic { width:20px; height:20px; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:18px; }

    .panel-wrap { flex:1; min-width:0; }
    .panel { display:none; background:rgba(29,39,51,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(120,200,255,.18); border-radius:14px; padding:24px 26px; box-shadow:0 8px 28px rgba(0,130,200,.16); }
    .panel.active { display:block; }
    .panel h3 { margin:0 0 4px; font-size:17px; }
    .panel .panel-sub { color:#86909C; font-size:13px; margin-bottom:20px; }
    .form-row { margin-bottom:18px; }
    .form-row label { display:block; font-size:14px; margin-bottom:7px; color:#cbd5e1; }
    .form-row .hint { font-size:12px; color:#64748b; margin-top:6px; }
    input[type=text], input[type=password], textarea {
      width:100%; background:rgba(15,20,25,.55); border:1px solid rgba(120,200,255,.18); color:#e2e8f0;
      border-radius:9px; padding:11px 13px; font-size:14px; outline:none; transition:border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus { border-color:#00D4FF; box-shadow:0 0 0 3px rgba(0,212,255,.15); }
    textarea { resize:vertical; font-family:inherit; }
    .two-col { display:flex; gap:16px; }
    .two-col .form-row { flex:1; }

    .btn { border:1px solid #334155; background:#334155; color:#e2e8f0; border-radius:9px; padding:11px 20px; font-size:14px; cursor:pointer; font-weight:600; transition:background .15s,border-color .15s; }
    .btn.primary { background:rgba(24,144,255,.12); border-color:rgba(24,144,255,.5); color:#4cb3ff; box-shadow:none; }
    .btn.primary:hover { background:rgba(24,144,255,.22); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .save-bar { margin-top:8px; display:flex; gap:12px; align-items:center; justify-content:flex-end; }

    /* 图片卡片网格 */
    .img-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; }
    .set-card { background:rgba(15,20,25,.45); border:1px solid rgba(120,200,255,.16); border-radius:12px; padding:14px; }
    .set-card .card-title { font-size:13px; color:#cbd5e1; margin-bottom:10px; }
    .photo-box { border:1.5px dashed rgba(120,200,255,.35); border-radius:11px; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; padding:8px; text-align:center; transition:border-color .15s; }
    .photo-box:hover { border-color:#38bdf8; }
    .photo-box.drag { border-color:#38bdf8; background:rgba(56,189,248,.06); }
    .photo-placeholder { color:#64748b; font-size:12px; }
    .photo-loading { color:#38bdf8; font-size:12px; }
    .photo-done img { max-width:100%; max-height:96px; border-radius:8px; }
    .photo-remove { position:absolute; top:4px; right:6px; background:rgba(0,0,0,.5); color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px; line-height:1; }
    .img-key { margin-top:8px; font-size:11px; color:#64748b; word-break:break-all; }
    .steps { color:#86909C; font-size:13px; line-height:1.7; padding-left:20px; margin:6px 0 16px; }
    .steps code { background:rgba(120,200,255,.1); padding:1px 6px; border-radius:5px; color:#7dd3fc; }
    .badge { font-size:11px; background:rgba(54,207,201,.18); color:#5eead4; padding:2px 8px; border-radius:20px; margin-left:6px; }
    .badge.green { background:rgba(16,185,129,.18); color:#34d399; }

    .toast { position:fixed; top:20px; right:20px; z-index:9999; background:rgba(16,185,129,.95); color:#04231a;
      font-size:13px; font-weight:600; padding:10px 18px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.3);
      opacity:0; transform:translateY(-12px); transition:opacity .25s, transform .25s; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }

    /* 与 OCR 区一致的设置卡片（站点信息 / 备案信息） */
    .settings-card { display:flex; flex-direction:column; background:rgba(15,20,25,.45); border:1px solid rgba(120,200,255,.16); border-radius:12px; overflow:hidden; margin-bottom:0; }
    .settings-card .card-head { display:flex; align-items:center; gap:10px; padding:16px 18px 12px; border-bottom:1px solid rgba(120,200,255,.12); }
    .settings-card .card-head h3 { margin:0; font-size:16px; }
    .settings-card .card-sub { padding:8px 18px 0; color:#86909C; font-size:13px; }
    .settings-card .card-body { padding:18px; }
    .settings-card .card-foot { padding:14px 18px 16px; border-top:1px solid rgba(120,200,255,.12); display:flex; justify-content:flex-end; gap:12px; }

    /* OCR 教程弹窗（settings.html 以 iframe 嵌入，需要自带样式） */
    .modal-mask { position:fixed; inset:0; background:rgba(2,6,23,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; z-index:200; }
    .modal-mask.show { display:flex; }
    .modal-mask .modal { cursor:auto; background:rgba(29,39,51,.92); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(120,200,255,.25); border-radius:14px; width:min(560px,94vw); max-height:90vh; overflow:auto;
      box-shadow:0 20px 60px rgba(0,130,200,.3); }
    .modal-mask .modal-head { padding:16px 20px; border-bottom:1px solid rgba(120,200,255,.18); font-weight:600; font-size:16px;
      display:flex; justify-content:space-between; align-items:center; }
    .modal-mask .modal-head .x { cursor:pointer; color:#86909C; font-size:22px; line-height:1; }
    .modal-mask .modal-head .x:hover { color:#fff; }
    .modal-mask .modal-body { padding:20px; }
    .modal-mask .modal-foot { padding:14px 20px; border-top:1px solid rgba(120,200,255,.18); display:flex; justify-content:flex-end; gap:10px; }

    /* ===== OCR 配置：标签 + 工具栏 ===== */
    .ocr-wrap { margin-top: 6px; }
    .ocr-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .ocr-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .ocr-tab { display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1px solid rgba(120,200,255,.2);
      background:rgba(29,39,51,.4); color:#cbd5e1; cursor:pointer; font-size:13.5px; transition:all .15s; }
    .ocr-tab:hover { color:#fff; border-color:rgba(120,200,255,.45); }
    .ocr-tab.active { background:rgba(24,144,255,.16); color:#7cc4ff; border-color:rgba(24,144,255,.5); font-weight:600; }
    .ocr-main-sel { display:flex; align-items:center; gap:8px; font-size:13px; color:#94a3b8; }
    .ocr-main-sel select { background:rgba(29,39,51,.7); color:#e2e8f0; border:1px solid rgba(120,200,255,.25); border-radius:8px; padding:7px 10px; font-size:13.5px; }
    .ocr-card { background:rgba(29,39,51,.45); border:1px solid rgba(120,200,255,.18); border-radius:14px; padding:18px 20px; }
    .ocr-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .ocr-card-title-wrap { display:flex; align-items:center; gap:10px; }
    .ocr-card-title { font-size:15px; font-weight:600; color:#e2e8f0; }
    .ocr-tut-btn { background:rgba(24,144,255,.12); border:1px solid rgba(24,144,255,.3); color:#7cc4ff; border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; }
    .ocr-tut-btn:hover { background:rgba(24,144,255,.22); }
    .ocr-card-body { display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; }
    .ocr-field { display:flex; flex-direction:column; gap:6px; }
    .ocr-field label { font-size:13px; color:#aab4c4; }
    .ocr-field input, .ocr-field textarea { background:rgba(11,17,24,.7); border:1px solid rgba(120,200,255,.22); border-radius:9px; padding:9px 11px; color:#e2e8f0; font-size:13.5px; width:100%; outline:none; }
    .ocr-field input:focus, .ocr-field textarea:focus { border-color:rgba(24,144,255,.55); }
    .ocr-input-wrap { display:flex; gap:6px; align-items:center; }
    .ocr-input-wrap input { flex:1; }
    .ocr-eye, .ocr-clear { flex:none; width:34px; height:34px; border-radius:8px; border:1px solid rgba(120,200,255,.22); background:rgba(29,39,51,.6); color:#cbd5e1; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; justify-content:center; }
    .ocr-eye:hover, .ocr-clear:hover { border-color:rgba(120,200,255,.45); color:#fff; }
    .ocr-eye svg { width:18px; height:18px; }
    .ocr-eye .eye-off { display:none; }
    .ocr-eye.showing .eye-open { display:none; }
    .ocr-eye.showing .eye-off { display:inline; }
    .ocr-test-result { margin-top:6px; padding:11px 14px; border-radius:10px; font-size:13.5px; line-height:1.5; border:1px solid transparent; }
    .ocr-test-result.testing { background:rgba(120,200,255,.1); border-color:rgba(120,200,255,.3); color:#bcdcff; }
    .ocr-test-result.ok { background:rgba(52,211,153,.14); border-color:rgba(52,211,153,.45); color:#7ff0c4; }
    .ocr-test-result.fail { background:rgba(248,113,113,.14); border-color:rgba(248,113,113,.45); color:#ffb3b3; }
    .ocr-test-result strong { font-weight:700; }
    .ocr-hint, .hint { font-size:12px; color:#8a97a8; display:flex; align-items:center; gap:6px; }
    .ocr-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
    .ocr-dot.on { background:#34d399; box-shadow:0 0 6px rgba(52,211,153,.6); }
    .ocr-dot.off { background:#475569; }
    .ocr-card-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .btn.ghost { background:transparent; border:1px solid rgba(120,200,255,.3); color:#9fc6e8; }
    .btn.ghost:hover { background:rgba(120,200,255,.08); color:#fff; }
    @media (max-width: 768px) {
      .ocr-card-body { grid-template-columns:1fr; }
      .ocr-toolbar { flex-direction:column; align-items:flex-start; }
    }
    @media (max-width: 768px) {
      .layout { flex-direction:column; }
      .nav { width:100%; display:flex; gap:8px; overflow-x:auto; position:static; }
      .nav-item { margin-bottom:0; white-space:nowrap; }
      .two-col { flex-direction:column; gap:0; }
    }
  </style>
</head>
<body class="embed">
  <div class="page">
    <div class="layout">
      <nav class="nav" id="set-nav">
        <div class="nav-item active" data-tab="site"><span class="ic" data-icon="site"></span>站点信息</div>
        <div class="nav-item" data-tab="icp"><span class="ic" data-icon="icp"></span>备案信息</div>
        <div class="nav-item" data-tab="img"><span class="ic" data-icon="image"></span>站点图片</div>
        <div class="nav-item" data-tab="ocr"><span class="ic" data-icon="ocr"></span>OCR 配置</div>
      </nav>

      <div class="panel-wrap">
        <!-- 站点信息 -->
        <section class="panel active" data-panel="site">
          <div class="settings-card">
            <div class="card-head"><h3>站点信息</h3><span class="badge green">对外展示</span></div>
            <div class="card-sub">用于识别页、分享卡片等对外展示的公司名称</div>
            <div class="card-body" id="site-fields"></div>
            <div class="card-foot"><button class="btn primary" id="save-site">保存站点信息</button></div>
          </div>
        </section>

        <!-- 备案信息 -->
        <section class="panel" data-panel="icp">
          <div class="settings-card">
            <div class="card-head"><h3>备案信息</h3><span class="badge green">页脚展示</span></div>
            <div class="card-sub">ICP 与公安备案号将展示在页脚</div>
            <div class="card-body" id="icp-fields"></div>
            <div class="card-foot"><button class="btn primary" id="save-info">保存备案信息</button></div>
          </div>
        </section>

        <!-- 站点图片 -->
        <section class="panel" data-panel="img">
          <h3>站点图片</h3>
          <div class="panel-sub">LOGO 等图片资源（点击 / 拖拽 / 粘贴上传）</div>
          <div class="img-grid" id="img-grid"></div>
          <div class="save-bar"><button class="btn primary" id="save-img">保存图片设置</button></div>
        </section>

        <!-- OCR 配置：每个通道一张卡片，独立保存 -->
        <section class="panel" data-panel="ocr">
          <h3>OCR 配置 <span class="badge">车牌识别</span></h3>
          <div class="panel-sub">用于识别车牌的 OCR 服务密钥（仅本机存储，不对外传输）。选择下方标签切换通道，可单独保存或测试连接。</div>
          <div class="ocr-wrap">
            <div class="ocr-toolbar">
              <div class="ocr-tabs" id="ocr-tabs"></div>
              <div class="ocr-main-sel">
                <label>主识别通道</label>
                <select id="ocr-main"></select>
              </div>
            </div>
            <div class="ocr-body" id="ocr-cards"></div>
          </div>
        </section>

      </div>
    </div>
    <div class="page-footer one-line" id="site-footer-text"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- OCR 通道教程模态框 -->
  <div class="modal-mask" id="ocr-tut-modal">
    <div class="modal">
      <div class="modal-head"><span id="ocr-tut-title">OCR 配置教程</span><span class="x" id="ocr-tut-close">×</span></div>
      <div class="modal-body" id="ocr-tut-body"></div>
      <div class="modal-foot"><button class="btn" id="ocr-tut-ok">知道了</button></div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/settings.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      initSettings();
    })();
  </script>
</body>
</html>
