<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据大屏 - 乾明车牌识别系统 - 管理后台</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="embed">
  <div class="main">
    <div class="content">
      <nav class="crumb" id="crumb"></nav>
      <div class="dash">
        <div class="stat-card"><div class="num" id="s-vehicles">—</div><div class="lbl">登记车辆总数</div></div>
        <div class="stat-card clickable" data-cat="long"><div class="num" id="s-long">—</div><div class="lbl">长期车辆</div></div>
        <div class="stat-card orange clickable" data-cat="temp"><div class="num" id="s-temp">—</div><div class="lbl">临时车辆</div></div>
        <div class="stat-card purple clickable" data-cat="expired"><div class="num" id="s-expired">—</div><div class="lbl">过期车辆</div></div>
        <div class="stat-card green"><div class="num" id="s-today">—</div><div class="lbl">今日识别次数</div></div>
        <div class="stat-card orange"><div class="num" id="s-internal">—</div><div class="lbl">内部车辆识别</div></div>
        <div class="stat-card purple"><div class="num" id="s-external">—</div><div class="lbl">外部车辆识别</div></div>
      </div>

      <div class="modal-mask" id="cat-modal">
        <div class="modal">
          <div class="modal-head"><span id="cat-title">分类明细</span><span class="x" id="cat-close">×</span></div>
          <div class="modal-body">
            <div class="cat-modal-list" id="cat-list"></div>
          </div>
          <div class="modal-foot">
            <button class="btn" id="cat-cancel">关闭</button>
          </div>
        </div>
      </div>

      <div class="dash-row">
        <div class="chart-box">
          <h3>近 7 天识别趋势</h3>
          <div class="bars" id="trend"></div>
        </div>
        <div class="chart-box">
          <h3>识别渠道占比</h3>
          <div id="channel" style="padding:8px 0"></div>
        </div>
      </div>

      <div class="chart-box" style="margin-top:16px">
        <h3>最近识别记录</h3>
        <div class="recent-list" id="recent"></div>
      </div>
    </div>
    <div class="page-footer" id="site-footer-text"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      initDashboard();
      bindCategoryCards();
    })();
  </script>
</body>
</html>
