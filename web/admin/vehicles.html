<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车辆管理 - 乾明车牌识别系统 - 管理后台</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="embed">
  <div class="main">
    <div class="content">
      <nav class="crumb" id="crumb"></nav>

      <div class="toolbar">
        <input id="search" class="search-input" placeholder="搜索车牌 / 车主 / 电话">
        <select id="dep-filter"><option value="">全部部门</option></select>
        <button class="btn primary" id="add-btn">+ 新增车辆</button>
        <button class="btn" id="refresh-btn">刷新</button>
        <button class="btn danger" id="batch-del-btn" style="display:none">批量删除</button>
        <span id="sel-count" style="color:var(--muted);font-size:13px;margin-left:4px"></span>
      </div>

      <div class="panel" style="padding:0;overflow:auto">
        <table class="data">
          <thead>
            <tr><th style="width:42px"><input type="checkbox" id="check-all"></th><th>照片</th><th>车牌</th><th>车主</th><th>电话</th><th>部门</th><th>有效期</th><th>备注</th><th>操作</th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">暂无车辆</div>
      </div>

      <div class="pager" id="pager"></div>
    </div>
    <div class="page-footer" id="site-footer-text"></div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="modal-head"><span id="modal-title">新增车辆</span><span class="x" id="modal-close">×</span></div>
      <div class="modal-body">
        <div class="form-row photo-row">
          <div class="photo-col">
            <label>车辆照片（点击 / 拖拽 / 粘贴上传，自动识别车牌）</label>
            <div class="photo-box" id="v-photo-box">
              <input type="file" id="v-photo-file" accept="image/*" hidden>
              <div class="photo-placeholder" id="v-photo-empty">
                <div class="photo-plus">+</div>
                <div class="photo-tip">点击或拖拽图片上传<br>支持 Ctrl+V 直接粘贴</div>
              </div>
              <div class="photo-loading" id="v-photo-loading" style="display:none">上传中…</div>
              <div class="photo-done" id="v-photo-done" style="display:none">
                <img id="v-photo-img" alt="车辆照片">
                <button class="photo-remove" id="v-photo-remove" type="button" title="移除照片">×</button>
              </div>
            </div>
          </div>
          <div class="plate-col">
            <label><span class="req">*</span>车牌号（上传照片后可自动识别）</label>
            <input id="f-plate" placeholder="如 粤B12345" maxlength="10" autocomplete="off">
            <div class="plate-area-hint" id="plate-area"></div>
          </div>
        </div>
        <div class="form-row row3">
          <div>
            <label><span class="req">*</span>车主</label>
            <input id="f-owner" placeholder="车主姓名">
          </div>
          <div>
            <label>手机号</label>
            <input id="f-phone" placeholder="联系电话">
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>部门（输入后回车添加，可添加多个，点击 × 删除）</label>
          <div class="tag-input-wrap" id="dep-tags-wrap">
            <div class="tag-input-box" id="dep-tags"></div>
            <input id="f-department" placeholder="输入部门后回车，或点击下方常用部门" autocomplete="off">
          </div>
          <div class="tag-suggest" id="dep-suggest"></div>
        </div>
        <div class="form-row">
          <label>有效期（开始时间默认今天，结束时间留空为长期）</label>
          <div class="date-range" id="valid-until-field">
            <span class="date-rng-item"><span class="date-rng-cap">开始时间</span><input type="text" id="f-valid-start" readonly onclick="openDatePicker()" placeholder="选择开始日期"></span>
            <span class="date-rng-sep">~</span>
            <span class="date-rng-item"><span class="date-rng-cap">结束时间</span><input type="text" id="f-valid-end" readonly onclick="openDatePicker()" placeholder="选择结束日期"></span>
            <button type="button" class="date-clear" id="valid-until-clear" onclick="clearValidUntil()" title="清除日期" style="display:none">✕</button>
          </div>
          <div class="date-picker" id="date-picker">
            <div class="dp-head">
              <button type="button" class="dp-nav" onclick="dpShift(-1)">‹</button>
              <span class="dp-title" id="dp-title"></span>
              <button type="button" class="dp-nav" onclick="dpShift(1)">›</button>
            </div>
            <div class="dp-week">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="dp-grid" id="dp-grid"></div>
            <div class="dp-tip" id="dp-tip"></div>
            <div class="dp-foot">
              <button type="button" class="btn sm" onclick="dpToday()">今天</button>
              <button type="button" class="btn sm" onclick="closeDatePicker()">完成</button>
            </div>
          </div>
          <div class="valid-duration" id="valid-duration"></div>
          <div class="hint">不填写结束时间表示长期有效；填写结束时间后，将自动显示有效期时长</div>
        </div>
        <div class="form-row">
          <label>备注</label>
          <textarea id="f-remark" rows="3" placeholder="备注信息（选填）"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt="大图"></div>

  <script src="js/common.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/vehicles.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      initVehicles();
    })();
  </script>
</body>
</html>
