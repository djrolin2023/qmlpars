<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>识别记录 - 乾明车牌识别系统 - 管理后台</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="embed">
  <div class="main">
    <div class="content">
      <nav class="crumb" id="crumb"></nav>
      <div class="toolbar">
        <select id="channel"><option value="">全部渠道</option><option value="app">APP</option><option value="web">H5</option></select>
        <input id="start" type="date" placeholder="开始日期">
        <input id="end" type="date" placeholder="结束日期">
        <button class="btn primary" id="query-btn">查询</button>
        <button class="btn danger" id="clear-btn">清空全部</button>
        <button class="btn danger" id="batch-del-btn" style="display:none">批量删除</button>
        <span id="sel-count" style="color:var(--muted);font-size:13px;margin-left:4px"></span>
      </div>

      <div class="panel" style="padding:0;overflow:auto">
        <table class="data" id="logTbl">
          <colgroup id="logColgroup"></colgroup>
          <thead>
            <tr><th data-col="check" style="width:42px"><input type="checkbox" id="check-all"></th><th data-col="plate">车牌</th><th data-col="channel">渠道</th><th data-col="result">结果</th><th data-col="conf">置信度</th><th data-col="img">已识别图片</th><th data-col="opby">操作人</th><th data-col="time">时间</th><th data-col="op">操作</th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">暂无记录</div>
      </div>

      <div class="pager" id="pager"></div>
    </div>
    <div class="page-footer one-line" id="site-footer-text"></div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/colresize.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/logs.js"></script>
  <script>
    (async () => {
      if (!(await checkAuth())) { location.replace('login.html'); return; }
      initLogs();
    })();
  </script>
</body>
</html>
