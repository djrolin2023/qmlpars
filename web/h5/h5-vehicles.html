<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>车辆管理 - 乾明车牌识别系统</title>
  <link rel="stylesheet" href="/cpsb/css/base.css">
  <link rel="stylesheet" href="/admin/css/base.css">
  <style>
    /* ===== H5 车辆管理：复用后台 admin 深色主题，仅加 h5 专属布局/移动端卡片/登录浮层/底部Tab ===== */
    /* admin 的 ::root 写成 ::root 导致变量失效，但其大量硬编码深色值已生效，直接复用即可 */
    /* 智慧科技感：深色底 + 淡蓝网格 + 角落光晕（与后台一致） */
    html, body{
      background-color:#0B1118 !important;
      background-image:
        radial-gradient(700px 480px at 10% -8%, rgba(0,180,255,.18), transparent 60%),
        radial-gradient(620px 480px at 100% 0%, rgba(54,207,201,.13), transparent 55%),
        radial-gradient(560px 560px at 85% 112%, rgba(0,120,255,.13), transparent 60%),
        linear-gradient(rgba(120,200,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,200,255,.05) 1px, transparent 1px);
      background-size: auto, auto, auto, 30px 30px, 30px 30px;
      background-attachment: fixed;
      color:#fff !important; color-scheme:dark !important;
    }
    input, select, textarea{ color-scheme:dark !important; }

    .h5-wrap{ max-width:960px; margin:0 auto; padding:14px 12px 90px; }
    .h5-head{ display:flex; align-items:center; gap:10px; padding:4px 2px 12px; }
    .h5-head .logo{ height:30px; width:auto; }
    .h5-head .title{ font-size:18px; font-weight:700; color:#fff; }

    /* 工具栏：桌面单行，移动端自动换行（搜索+查询通栏、其余一行） */
    .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .toolbar .search-input{ flex:1 1 220px; min-width:0; height:40px; padding:0 12px; border-radius:10px;
      border:1px solid #2E3A4B; background:#0F1419; color:#fff; outline:none; font-size:14px; }
    .toolbar .search-input:focus{ border-color:#1890ff; }
    .toolbar .btn{ height:40px; padding:0 16px; border-radius:10px; font-size:14px; white-space:nowrap; flex:0 0 auto; }
    .toolbar select#dep-filter{ height:40px; padding:0 10px; border-radius:10px; border:1px solid #2E3A4B;
      background:#0F1419; color:#fff; outline:none; font-size:14px; flex:0 0 auto; max-width:140px; }
    #sel-count{ margin-left:2px; }

    /* 表格容器：贴边，去掉 admin panel 的 18px padding 让表格更紧凑 */
    .panel{ padding:0 !important; margin-bottom:0 !important; overflow:hidden;
      background:rgba(29,39,51,.45) !important; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(120,200,255,.16) !important; box-shadow:0 8px 28px rgba(0,130,200,.16); }
    .data td, .data th{ color:#fff; }

    /* 内嵌管理员登录浮层（深色卡片，与后台一致） */
    .login-overlay{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.6); backdrop-filter:blur(2px); padding:20px; }
    .login-card{ width:100%; max-width:360px; background:rgba(29,39,51,.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(120,200,255,.22); border-radius:16px; padding:26px 22px 20px;
      box-shadow:0 12px 40px rgba(0,130,200,.3); text-align:center; }
    .login-card .login-logo img{ height:38px; margin-bottom:10px; }
    .login-title{ font-size:19px; font-weight:700; color:#fff; margin-bottom:4px; }
    .login-sub{ font-size:13px; color:#86909C; margin-bottom:18px; line-height:1.5; }
    .login-input{ width:100%; box-sizing:border-box; padding:12px 14px; font-size:15px; border:1px solid #2E3A4B;
      border-radius:10px; outline:none; margin-bottom:12px; background:#0F1419; color:#fff; }
    .login-input:focus{ border-color:#1890ff; }
    .login-btn{ width:100%; padding:12px; font-size:15px; background:linear-gradient(135deg,#1890FF,#36CFC9); color:#04283a; border:none; border-radius:10px; cursor:pointer; text-align:center; font-weight:600; }
    .login-btn:hover{ background:linear-gradient(135deg,#40a9ff,#5eead4); }
    .login-err{ color:#F76560; font-size:13px; min-height:18px; margin-top:8px; text-align:center; }
    .login-back{ margin-top:14px; font-size:13px; color:#1890ff; cursor:pointer; text-align:center; }
    .login-back:hover{ text-decoration:underline; }

    /* 底部 Tab（深色，与后台风格一致） */
    .bottom-tabs{ position:fixed; left:0; right:0; bottom:0; height:60px; background:rgba(29,39,51,.6); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      border-top:1px solid rgba(120,200,255,.18); display:flex; z-index:90; padding-bottom:env(safe-area-inset-bottom,0); }
    .bottom-tab{ flex:1; background:none; border:none; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:2px; color:#86909C; font-size:12px; cursor:pointer; }
    .bottom-tab.active{ color:#1890ff; position:relative; }
    .bottom-tab.active::after{ content:''; position:absolute; top:0; left:25%; right:25%; height:3px;
      border-radius:0 0 3px 3px; background:linear-gradient(90deg,#1890FF,#36CFC9); }
    .bottom-tab .bt-icon{ font-size:22px; line-height:1; }

    /* ===== 车牌按钮式列表 ===== */
    .plate-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; }
    .plate-btn{ background:linear-gradient(135deg,#1f3a5f,#0f2942); border:1px solid rgba(120,200,255,.22);
      border-radius:12px; padding:14px 12px; cursor:pointer; text-align:center; transition:.15s; box-shadow:0 6px 18px rgba(0,130,200,.18); }
    .plate-btn:active{ transform:scale(.97); }
    /* 真实车牌外观 */
    .plate-no{ position:relative; display:inline-flex; align-items:center; justify-content:center; min-width:118px;
      padding:7px 10px 7px 9px; border-radius:7px; white-space:nowrap;
      font-weight:800; font-size:20px; letter-spacing:1px; line-height:1.1; color:#fff; text-align:center;
      border:2px solid rgba(255,255,255,.85); box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
    .plate-no .prov{ padding:0 3px; display:inline-block; width:6px; height:6px; margin:0 2px;
      border-radius:50%; background:rgba(255,255,255,.85); vertical-align:middle; }
    .plate-no.yellow .prov, .plate-no.white .prov{ background:rgba(0,0,0,.7); }
    .plate-no .ev-mark{ display:inline-flex; align-items:center; justify-content:center; height:14px; margin:0 3px; }
    .plate-no .ev-mark img{ height:14px; width:auto; display:block; }
    .plate-no.blue{ background:linear-gradient(180deg,#2b7fff,#0b5ed7); color:#fff; }
    .plate-no.yellow{ background:linear-gradient(180deg,#ffd21e,#f0b400); color:#1a1a1a; border-color:rgba(0,0,0,.3); }
    .plate-no.green{ background:linear-gradient(180deg,#1ec77a,#0a7a3e); color:#fff; border-color:rgba(255,255,255,.18); }
    .plate-no.white{ background:linear-gradient(180deg,#f4f6f8,#dfe4e8); color:#1a1a1a; border-color:rgba(0,0,0,.25); }
    .plate-meta{ margin-top:10px; font-size:13px; color:#c9d4e0; line-height:1.6; }
    .plate-meta b{ color:#fff; font-weight:600; }
    .plate-dep{ display:inline-block; margin-top:6px; background:rgba(24,144,255,.18); color:#69c0ff;
      border-radius:6px; padding:1px 8px; font-size:12px; }
    .plate-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; justify-content:center; }
    .plate-photo{ display:inline-flex; align-items:center; justify-content:center; margin-left:8px; vertical-align:middle;
      width:20px; height:20px; border-radius:5px; }
    .plate-photo.has{ background:rgba(54,207,201,.16); color:#36cfc9; }
    .plate-photo.none{ background:rgba(255,122,112,.14); color:#ff8a80; }

    /* 工具栏两行布局：搜索框+部门+查询 一行；刷新+新增 一行（两端对齐） */
    .toolbar{ display:flex; flex-direction:column; gap:8px; align-items:stretch; }
    .toolbar-row{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; width:100%; box-sizing:border-box; }
    .toolbar-search-row .search-input{ flex:1 1 0; min-width:0; }
    .toolbar-search-row select#dep-filter{ flex:1 1 auto; min-width:0; max-width:46%; }
    .toolbar-search-row #query-btn{ flex:0 0 auto; flex-shrink:0; }
    .toolbar-action-row{ justify-content:space-between; }
    .toolbar-action-row #refresh-btn{ flex:0 0 auto; }
    .toolbar-action-row #add-btn{ flex:1 1 auto; max-width:65%; margin-left:8px; }
    .toolbar-action-row #batch-del-btn{ flex:0 0 auto; }

    /* 新增/编辑模态框样式优化 */
    #modal-box{ width:min(560px,96vw); border-radius:16px; overflow:hidden; }
    #modal .modal-head{ background:linear-gradient(135deg,#0e2233,#143047); color:#fff; padding:18px 20px; font-size:18px; font-weight:700; letter-spacing:.5px; }
    #modal .modal-head .x{ color:rgba(255,255,255,.7); }
    #modal .modal-body{ padding:18px 18px 8px; }
    #modal .form-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    #modal .form-row > div{ min-width:0; width:100%; }
    #modal .photo-row, #modal .row3{ display:flex; flex-direction:column; gap:14px; }
    #modal label{ display:block; font-weight:600; font-size:13.5px; color:var(--txt,#e7eef6); margin-bottom:2px; }
    #modal label .req{ color:#ff8a80; margin-right:3px; }
    #modal input, #modal textarea, #modal select{
      width:100%; box-sizing:border-box; padding:12px 13px; font-size:15px; line-height:1.3;
      background:var(--card,#1D2733); border:1px solid var(--line,#2E3A4B);
      border-radius:10px; color:var(--txt,#e7eef6); outline:none; transition:border-color .15s, box-shadow .15s;
    }
    #modal input:focus, #modal textarea:focus{ border-color:var(--ok,#36cfc9); box-shadow:0 0 0 3px rgba(54,207,201,.18); }
    #modal textarea{ resize:vertical; }
    /* 车牌号：模拟车牌样式 + 居中放大 */
    #modal #f-plate{
      text-align:center; font-size:22px; font-weight:800; letter-spacing:3px;
      text-transform:uppercase; padding:14px 12px;
      background:linear-gradient(135deg,#1b3a2c,#143a4a); color:#ffe27a; border:2px solid #2f7d5e;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",monospace;
    }
    #modal #f-plate::placeholder{ color:rgba(255,226,122,.45); letter-spacing:1px; font-weight:600; font-size:16px; }
    #modal .plate-area-hint{ text-align:center; font-size:12.5px; color:var(--ok,#36cfc9); margin-top:4px; min-height:16px; }
    /* 部门标签：加底色、加粗（呼应列表风格） */
    #modal .tag-input-wrap{ background:var(--card,#1D2733); border:1px solid var(--line,#2E3A4B); border-radius:10px; padding:8px 10px; min-height:46px; }
    #modal .tag-input-box{ display:flex; flex-wrap:wrap; gap:6px; }
    #modal .tag{ display:inline-flex; align-items:center; gap:5px; background:rgba(54,207,201,.16); color:#36cfc9; border:1px solid rgba(54,207,201,.4); font-weight:700; font-size:13.5px; padding:4px 10px; border-radius:8px; }
    #modal .tag a, #modal .tag .tag-x{ cursor:pointer; opacity:.7; font-weight:700; text-decoration:none; color:inherit; margin-left:2px; padding:0 2px; }
    #modal .tag a:hover, #modal .tag .tag-x:hover{ opacity:1; }
    #modal #f-department{ border:none; background:transparent; padding:6px 2px; font-size:14px; }
    #modal .tag-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    #modal .tag-suggest span{ cursor:pointer; background:rgba(255,255,255,.05); border:1px solid var(--line,#2E3A4B); color:var(--sub,#8aa0b4); font-size:12.5px; padding:3px 9px; border-radius:7px; }
    #modal .tag-suggest span:hover{ border-color:var(--ok,#36cfc9); color:var(--ok,#36cfc9); }
    /* 照片上传区 */
    #modal .photo-col{ order:-1; }
    #modal .photo-box{ border:1.5px dashed var(--line,#2E3A4B); border-radius:12px; background:var(--card,#1D2733); min-height:120px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative; }
    #modal .photo-box:active{ border-color:var(--ok,#36cfc9); }
    #modal .photo-placeholder{ text-align:center; color:var(--sub,#8aa0b4); }
    #modal .photo-plus{ font-size:34px; font-weight:300; line-height:1; }
    #modal .photo-tip{ font-size:12px; margin-top:6px; }
    #modal .photo-done img{ max-width:100%; display:block; border-radius:10px; }
    #modal .photo-remove{ position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff; font-size:16px; cursor:pointer; }
    /* 日期范围 */
    #modal .date-range{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; position:relative; }
    #modal .date-rng-item{ display:flex; flex-direction:column; gap:3px; flex:1 1 130px; }
    #modal .date-rng-cap{ font-size:11.5px; color:var(--sub,#8aa0b4); }
    #modal .date-rng-sep{ color:var(--sub,#8aa0b4); padding-top:14px; }
    #modal .date-picker{ position:absolute; z-index:30; background:var(--card,#1D2733); border:1px solid var(--line,#2E3A4B); border-radius:12px; padding:12px; box-shadow:0 12px 32px rgba(0,0,0,.4); }
    #modal .hint{ font-size:12px; color:var(--sub,#8aa0b4); line-height:1.5; margin-top:4px; }
    #modal .valid-duration{ font-size:12.5px; color:var(--ok,#36cfc9); margin-top:4px; min-height:0; }
    #modal .modal-foot{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line,#2E3A4B); background:var(--card,#1D2733); }
    #modal .modal-foot .btn{ flex:1 1 0; padding:13px; font-size:15px; font-weight:600; border-radius:10px; }
    #modal .modal-foot .btn.primary{ box-shadow:0 4px 14px rgba(54,207,201,.25); }

    @media (max-width: 768px) {
      .h5-wrap{ padding:max(16px, env(safe-area-inset-top)) 12px 80px; }
    }
    @media (max-width: 560px) {
      .toolbar-search-row select#dep-filter{ max-width:38%; }
      .toolbar-action-row #add-btn{ max-width:none; }
      /* 窄屏：模态框接近全屏，按钮固定大点击区 */
      #modal-box{ width:96vw; max-height:90vh; display:flex; flex-direction:column; }
      #modal .modal-body{ overflow:auto; -webkit-overflow-scrolling:touch; }
      #modal .modal-foot{ flex-direction:column-reverse; position:sticky; bottom:0; }
      #modal .modal-foot .btn{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="h5-wrap">
    <div class="h5-head">
      <img class="logo" src="/static/images/logo.png" alt="logo" onerror="this.style.display='none'">
      <span class="title">车辆管理</span>
    </div>

    <div class="toolbar">
      <div class="toolbar-row toolbar-search-row">
        <input id="search" class="search-input" placeholder="搜索车牌 / 车主 / 电话">
        <select id="dep-filter"><option value="">全部部门</option></select>
        <button class="btn primary" id="query-btn">查询</button>
      </div>
      <div class="toolbar-row toolbar-action-row">
        <button class="btn" id="refresh-btn">刷新</button>
        <button class="btn primary add" id="add-btn">+ 新增车辆</button>
        <button class="btn danger" id="batch-del-btn" style="display:none">批量删除</button>
      </div>
      <span id="sel-count" style="color:var(--muted);font-size:13px;margin-left:4px"></span>
    </div>

    <div class="panel" id="vehPanel" style="display:block;padding:0;overflow:auto">
      <div class="plate-list" id="list"></div>
      <div id="empty" class="empty" style="display:none">暂无车辆</div>
    </div>

    <div class="pager" id="pager"></div>
  </div>

  <!-- 详情模态框 -->
  <div class="modal-mask" id="detailModal">
    <div class="modal" style="width:min(420px,96vw)">
      <div class="modal-head detail-head">
        <div class="modal-plate-wrap"><span class="plate-no" id="dPlate">粤B12345</span></div>
        <div class="modal-sub" id="dSub">归属地</div>
        <div class="x" id="detail-close">×</div>
      </div>
      <div class="modal-body">
        <div class="d-row d-row-owner">
          <div class="d-label">车主</div>
          <div class="d-value" id="dOwner">-</div>
          <div class="d-thumb" id="dThumb" title="点击查看大图">
            <img id="dThumbImg" alt="车辆缩略图" style="display:none">
            <div class="d-thumb-empty" id="dThumbEmpty" aria-label="无车辆图片" title="暂无车辆图片">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5a1.5 1.5 0 0 1 1.5 1.5V17a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4.5 11H5zm2.1 0h9.8l-1.1-3.2a.5.5 0 0 0-.47-.35H8.67a.5.5 0 0 0-.47.35L7.1 11zM7.5 14a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm9 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="d-row"><div class="d-label">电话</div><div class="d-value" id="dPhone">-</div></div>
        <div class="d-row"><div class="d-label">部门</div><div class="d-value" id="dDept">-</div></div>
        <div class="d-row"><div class="d-label">有效期</div><div class="d-value" id="dValid">-</div></div>
        <div class="d-row"><div class="d-label">备注</div><div class="d-value" id="dRemark">-</div></div>
      </div>
      <div class="d-foot">
        <button class="btn ghost danger-text" id="detail-del">删除</button>
        <button class="btn ghost" id="detail-edit">编辑</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="modal" id="modal-box">
      <div class="modal-head"><span id="modal-title">新增车辆</span><span class="x" id="modal-close">×</span></div>
      <div class="modal-body">
        <!-- 单条录入 -->
        <div class="batch-single" id="batch-single">
        <div class="form-row photo-row">
          <div class="photo-col">
            <label>车辆照片（点击 / 拖拽 / 粘贴上传，自动识别车牌）</label>
            <div class="photo-box" id="v-photo-box">
              <input type="file" id="v-photo-file" accept="image/*" hidden>
              <div class="photo-placeholder" id="v-photo-empty">
                <div class="photo-plus">+</div>
                <div class="photo-tip">点击或拖拽图片上传<br>支持 Ctrl+V 直接粘贴</div>
              </div>
              <div class="photo-loading" id="v-photo-loading" style="display:none">上传中…</div>
              <div class="photo-done" id="v-photo-done" style="display:none">
                <img id="v-photo-img" alt="车辆照片">
                <button class="photo-remove" id="v-photo-remove" type="button" title="移除照片">×</button>
              </div>
            </div>
          </div>
          <div class="plate-col">
            <label><span class="req">*</span>车牌号（上传照片后可自动识别）</label>
            <input id="f-plate" placeholder="如 粤B12345" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" lang="en" inputmode="text">
            <div class="plate-area-hint" id="plate-area"></div>
          </div>
        </div>
        <div class="form-row row3">
          <div>
            <label><span class="req">*</span>车主</label>
            <input id="f-owner" placeholder="车主姓名">
          </div>
          <div>
            <label>手机号</label>
            <input id="f-phone" placeholder="联系电话">
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>部门（输入后回车添加，可添加多个，点击 × 删除）</label>
          <div class="tag-input-wrap" id="dep-tags-wrap">
            <div class="tag-input-box" id="dep-tags"></div>
            <input id="f-department" placeholder="输入部门后回车，或点击下方常用部门" autocomplete="off">
          </div>
          <div class="tag-suggest" id="dep-suggest"></div>
        </div>
        <div class="form-row">
          <label>有效期（开始时间默认今天，结束时间留空为长期）</label>
          <div class="date-range" id="valid-until-field">
            <span class="date-rng-item"><span class="date-rng-cap">开始时间</span><input type="text" id="f-valid-start" readonly onclick="openDatePicker()" placeholder="选择开始日期"></span>
            <span class="date-rng-sep">~</span>
            <span class="date-rng-item"><span class="date-rng-cap">结束时间</span><input type="text" id="f-valid-end" readonly onclick="openDatePicker()" placeholder="选择结束日期"></span>

  <script>
    function redirectToLogin() {
      try { localStorage.removeItem('qmlpars_admin_token'); localStorage.removeItem('qmlpars_user_token'); } catch (e) {}
      location.replace('/cpsb/login.html?redirect=' + encodeURIComponent(location.pathname + location.search));
    }

    // 覆盖 common.js 的 doLogout：H5/APP 车辆管理页应回到用户登录页，而不是后台管理登录页
    window.doLogout = redirectToLogin;

    // 校验：优先用普通用户令牌(user_sessions)，其次管理员令牌(admin_sessions)
    // 由于后台 authMiddleware 同时接受两种令牌，普通管理员/普通用户也能进入本页
    async function probeToken(t) {
      if (!t) return null;
      try {
        const r = await fetch('/api/admin/me', { headers: { 'x-admin-token': t } });
        if (!r.ok) return null;
        const data = await r.json().catch(() => null);
        if (data && data.success) return data.data;
        return null;
      } catch (e) { return null; }
    }

    (async () => {
      // 1) 管理员令牌
      let me = await probeToken(getToken());
      // 2) 普通用户令牌（H5/APP 登录得到，存于 qmlpars_user_token）
      if (!me) {
        const ut = localStorage.getItem('qmlpars_user_token');
        const d = await probeToken(ut);
        if (d) { setToken(ut); me = d; } // 迁移到 api() 使用的令牌槽位
      }
      if (me) {
        const who = document.getElementById('current-user');
        if (who) who.textContent = (me.name || me.user || '') + (me.role ? '（' + roleName(me.role) + '）' : '');
        initVehicles();
        return;
      }
      // 未登录：提示并跳用户登录页
      const listEl = document.getElementById('list');
      if (listEl) listEl.innerHTML = '<div class="empty">登录已失效，正在跳转到登录页…</div>';
      redirectToLogin();
    })();

    function roleName(r) {
      return ({ admin: '超级管理员', manager: '普通管理员', user: '普通用户' })[r] || r || '';
    }
  </script>
