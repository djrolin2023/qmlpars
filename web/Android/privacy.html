<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>隐私权限 - 乾明车牌识别系统</title>
<link rel="icon" href="/static/images/logo.png">
<link rel="stylesheet" href="css/base.css">
<style>
  body{ padding-bottom:0; }
  .page-wrap{ max-width:720px; margin:0 auto; padding:24px 18px 40px; }
  .page-title{ font-size:20px; font-weight:700; color:var(--text); margin-bottom:18px; text-align:center; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h3{ font-size:16px; color:var(--accent); margin:0 0 10px; }
  .card p{ font-size:14px; color:var(--sub); line-height:1.8; margin:0 0 8px; }
  .back{ display:inline-block; margin-top:10px; padding:10px 22px; border-radius:10px; background:var(--accent); color:#04283a; text-decoration:none; font-weight:600; }
  .foot-links{ text-align:center; margin-top:24px; font-size:13px; color:var(--sub); }
  .foot-links a{ color:var(--sub); margin:0 8px; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-title">隐私权限</div>
  <div class="card">
    <h3>一、信息收集与使用</h3>
    <p>本系统仅收集您主动录入的车牌、车主、联系方式等车辆管理信息，用于识别、登记与查询。识别过程临时使用摄像头画面，不会长期保存无关影像。</p>
  </div>
  <div class="card">
    <h3>二、权限说明</h3>
    <p>摄像头扫描功能需要您授权相机权限；若拒绝授权，仍可切换到“输入查询”模式手动使用。系统不会读取与业务无关的通讯录、位置、短信等隐私权限。</p>
  </div>
  <div class="card">
    <h3>三、数据存储</h3>
    <p>车辆与账号数据存储于您部署本系统的服务器本地数据库中，不会主动向第三方传输。数据安全由部署方负责管理。</p>
  </div>
  <div class="card">
    <h3>四、您的权利</h3>
    <p>您可以随时查看、修改或删除您录入的车辆数据；停止使用后可联系管理员清除账号及相关信息。</p>
  </div>
  <div style="text-align:center"><a href="./" class="back">返回首页</a></div>
  <div class="foot-links">
    <a href="usage.html">使用说明</a> | <a href="privacy.html">隐私权限</a>
  </div>
</div>
</body>
</html>
