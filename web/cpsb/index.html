<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{SITE}车牌识别系统</title>
<link rel="icon" href="/static/images/logo.png">
<meta property="og:title" content="{SITE}车牌识别系统">
<meta property="og:description" content="对准车牌自动扫描，或切换输入查询">
<meta property="og:image" content="/static/images/logo.png">
<meta property="og:url" content="/cpsb/">
<meta name="thumbnail" content="/static/images/logo.png">
<link rel="stylesheet" href="css/base.css">
<style>
  /* 鉴权前隐藏主体，避免未登录闪现识别界面 */
  body.guard-loading{ visibility:hidden; }
</style>
</head>
<body class="guard-loading">

<!-- 悬浮分享按钮 -->
<button class="fab-share" onclick="copyLink()" aria-label="分享">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
  </svg>
</button>

<!-- 顶部用户区（固定在页头，不随页面下拉消失） -->
<div class="top-user" id="topUser"></div>

<!-- 学校标识（随页面下拉滚动） -->
<div class="org-stack">
  <div class="brand-logo" id="orgLogo"></div>
  <div class="sub-org" id="orgName" data-site-suffix=" · 车辆识别">车辆识别</div>
  <div class="sub-hint">对准车牌自动扫描，或切换输入查询</div>
</div>

<!-- 标签 -->
<div class="tabs">
  <div class="tab active" id="tab-cam" onclick="switchTab('cam')">摄像头扫描</div>
  <div class="tab" id="tab-q" onclick="switchTab('q')">输入查询</div>
</div>

<!-- 摄像头扫描面板 -->
<div class="panel active" id="panel-cam">
  <div class="cam-card">
    <div class="cam-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-corner tl"></div><div class="cam-corner tr"></div>
      <div class="cam-corner bl"></div><div class="cam-corner br"></div>
      <div class="cam-reticle"></div>
      <div class="scan-line"></div>
      <button class="cam-torch hidden" id="torchBtn" onclick="toggleTorch()" aria-label="灯光">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2h6c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"></path>
        </svg>
      </button>
      <div class="cam-status" id="camStatus">扫描中… 对准车牌保持 1~2 秒</div>
      <div class="cam-mask hidden" id="camMask">
        <button class="cam-resume" id="resumeBtn" onclick="resumeScan()">继续扫描</button>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button onclick="switchCam()">翻转镜头</button>
    <button class="primary" id="stopBtn" onclick="toggleScan()">停止扫描</button>
  </div>
</div>

<!-- 输入查询面板 -->
<div class="panel" id="panel-q">
  <div class="qbox">
    <input id="qPlate" placeholder="输入车牌号，如：粤B12345" maxlength="10" autocomplete="off" autocapitalize="characters" inputmode="text" enterkeyhint="search" onblur="this.value=this.value.toUpperCase().replace(/[\s·\-.　]/g,'')" onkeydown="if(event.key==='Enter')queryPlate()">
    <button onclick="queryPlate()">查询</button>
  </div>
  <div class="err" id="qErr"></div>
</div>

<!-- 结果 -->
<div class="result" id="result"></div>

<!-- 底部 -->
<footer id="siteFooter">
  <div class="footer-logo" id="footerLogo"></div>
  © 2026 乾明工作室 版权所有<br>
  技术支持：<a href="#">乾明</a> &nbsp;|&nbsp;
  <svg class="ipv6-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="IPv6">
    <path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"></path>
  </svg>
  仅支持 IPv6 访问<br>
  <span id="icpLine"></span>
  <span id="policeLine"></span>
</footer>

<!-- 底部 Tab（与 APP 一致：车牌识别 / 车辆管理） -->
<nav class="bottom-tabs">
  <button class="bottom-tab active" data-tab="cpsb" onclick="location.href='/cpsb/'">
    <span class="bt-icon">🔍</span><span class="bt-label">车牌识别</span>
  </button>
  <button class="bottom-tab" data-tab="vehicles" onclick="location.href='/cpsb/h5-vehicles.html'">
    <span class="bt-icon">🚗</span><span class="bt-label">车辆管理</span>
  </button>
</nav>

<script src="js/common.js"></script>
<script src="js/query.js"></script>
<script src="js/camera.js"></script>
<script>
/* 门禁：已登录（token 且后端有效）才初始化识别功能，否则跳登录页 */
(async ()=>{
  if(await checkLogin()){
    document.body.classList.remove('guard-loading');
    renderUserArea();
    applySiteName();
    applyFavicon();
    applyBrandLogo(document.getElementById('orgLogo'), 'icon');
    applyBrandLogo(document.getElementById('footerLogo'), 'icon');
    applyBeian();
  } else {
    goLogin();
  }
})();
</script>
</body>
</html>
