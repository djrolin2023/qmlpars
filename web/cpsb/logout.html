<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>已退出 - {SITE}</title>
<link rel="icon" href="/static/images/logo.png">
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background-color:#0B1118;
    background-image:
      radial-gradient(700px 480px at 10% -8%, rgba(0,180,255,.18), transparent 60%),
      radial-gradient(620px 480px at 100% 0%, rgba(54,207,201,.13), transparent 55%),
      radial-gradient(560px 560px at 85% 112%, rgba(0,120,255,.13), transparent 60%),
      linear-gradient(rgba(120,200,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,200,255,.05) 1px, transparent 1px);
    background-size: auto, auto, auto, 30px 30px, 30px 30px;
    background-attachment: fixed;
    color:#fff; min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .wrap{ max-width:360px; }
  .brand-logo{ margin:0 auto 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .brand-logo.brand-horizontal{ flex-direction:row; }
  .brand-logo-img{ max-width:160px; max-height:72px; object-fit:contain; }
  .brand-cap{ font-size:18px; font-weight:700; color:#fff; }
  h1{ margin:0 0 8px; font-size:20px; }
  p{ margin:0 0 26px; color:#86909C; font-size:14px; line-height:1.7; }
  .btn{
    display:inline-block; padding:13px 30px; border-radius:12px; text-decoration:none;
    background:linear-gradient(135deg,#1890ff,#36cfc9); color:#04283a; font-size:15px; font-weight:700;
    box-shadow:0 4px 16px rgba(0,170,230,.35);
  }
  .btn:hover{ box-shadow:0 6px 22px rgba(0,200,255,.5); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-logo" id="brandLogo"></div>
    <h1>您已安全退出</h1>
    <p>感谢使用<span data-site>物业车辆识别系统</span>。<br>下次进入需重新登录。</p>
    <a class="btn" href="login.html">重新登录</a>
  </div>
  <script src="js/common.js"></script>
  <script>
    // 确保本地 token 已清理（兜底）
    setUserToken('');
    try { localStorage.removeItem('guard_auto_login'); } catch(_){}
    applySiteName();
    applyBrandLogo(document.getElementById('brandLogo'), 'icon');
    applyFavicon();
  </script>
</body>
</html>
